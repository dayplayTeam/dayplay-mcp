name: Publish to npm (Trusted Publishing / OIDC)

# Release flow: bump version in package.json, commit, tag, push.
#   npm version patch && git push --follow-tags
# npm's trusted-publisher binding (configured once on npmjs.com) authorizes
# publishes from this exact repo + workflow — no NPM_TOKEN secret required.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # OIDC for npm trusted publishing + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          # No NODE_AUTH_TOKEN — auth is OIDC-based via id-token: write

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install npm with OIDC trusted-publishing support
        run: npm install -g npm@latest

      - name: Install deps and smoke test
        run: |
          npm ci --no-fund --no-audit
          npm run smoke

      - name: Publish with provenance
        run: npm publish --access public --provenance

      - name: Install MCP Publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the official MCP registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
