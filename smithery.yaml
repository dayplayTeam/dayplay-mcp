name: dayplay
displayName: DayPlay — SF Bay Area Local Intelligence for AI Agents
description: >-
  Verified real-time SF Bay Area places, events & itineraries for AI agents.
  Geo-locked to San Francisco, Oakland & Berkeley (35 neighborhood centroids).
  40-tool catalog: open feeds (today/weekend/live-now, browse, venues, gems)
  plus gated search, saves & outing planning via free Google connect (browser
  open now supported through the stdio bridge). Honest zero-results protocol:
  agents never fabricate venues, events, dates, or hours (Anti-Drift Guarantee).
  One remote URL.
version: 2.0.2
license: MIT
homepage: https://www.dayplay.io
repository: https://github.com/dayplayTeam/dayplay-mcp
tags:
  - sf
  - san-francisco
  - bay-area
  - travel
  - nightlife
  - itinerary
  - events
  - anti-drift
  - mcp
categories:
  - travel
  - local-search
  - events
  - lifestyle
examples:
  - "What's happening in the Mission tonight?"
  - "Find a place open right now in North Beach with a 4.5+ rating."
  - "Build me a Saturday itinerary that never leaves Bernal Heights."
  - "Which Berkeley events are on this weekend?"
  - "What's on in Austin tonight? (out of market - Dayplay is strictly SF Bay Area only, so no results are returned)"
startCommand:
  type: http
  url: https://api.dayplay.io/mcp
  configSchema:
    type: object
    properties: {}
    required: []
tools:
  - name: get_happening_today
    description: Events and places happening today (lat/lng/radius).
  - name: get_weekend
    description: Saturday or Sunday feed.
  - name: get_live_now
    description: What is happening right now.
  - name: search_smart
    description: Smart search (gated - requires free DayPlay account via Google connect).
  - name: save_outing
    description: Save a multi-stop outing plan (gated - free account).
  - name: get_my_itinerary
    description: Retrieve saved itineraries (gated - free account).
