name: dayplay
displayName: Dayplay — Verified Physical Intelligence for Major Metros Nationwide
description: >-
  Verified real-time physical intelligence for AI agents — live across all
  major US metros, with the SF Bay Area as flagship market. Places, events &
  walkable itineraries from a verified 40-tool catalog (Anti-Drift Guarantee).
  Remote endpoint: https://api.dayplay.io/mcp
version: 2.2.7

license: MIT
homepage: https://www.dayplay.io
repository: https://github.com/dayplayTeam/dayplay-mcp
tags:
  - nationwide
  - major-metros
  - multi-city
  - sf
  - san-francisco
  - bay-area
  - travel
  - nightlife
  - itinerary
  - events
  - anti-drift
  - mcp
categories:
  - travel
  - local-search
  - events
  - lifestyle
examples:
  - "What's happening in the Mission tonight?"
  - "Find a place open right now in North Beach with a 4.5+ rating."
  - "Build me a Saturday itinerary that never leaves Bernal Heights."
  - "Which Berkeley events are on this weekend?"
  - "What's on in Austin tonight? (coverage is verified per request - a metro not yet live returns an honest out-of-market result, never fabricated data)"
startCommand:
  type: http
  url: https://api.dayplay.io/mcp
  configSchema:
    type: object
    properties: {}
    required: []
tools:
  - name: get_happening_today
    description: Events and places happening today (lat/lng/radius).
  - name: get_weekend
    description: Saturday or Sunday feed.
  - name: get_live_now
    description: What is happening right now.
  - name: search_smart
    description: Smart search (gated - requires free Dayplay account via Google connect).
  - name: save_outing
    description: Save a multi-stop outing plan (gated - free account).
  - name: get_my_itinerary
    description: Retrieve saved itineraries (gated - free account).
